name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare distribution APK
        run: cp app/build/outputs/apk/debug/app-debug.apk memory-drawer.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-drawer-apk
          path: memory-drawer.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest memory-drawer.apk \
            --title "기억의 서랍 V1.3" \
            --notes "Android 설치용 최신 APK입니다. memory-drawer.apk를 내려받아 패키지 설치 프로그램으로 설치하세요." \
            --latest
