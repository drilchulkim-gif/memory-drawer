<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기억의 서랍</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#18352f;background:#f4f1e8;--g:#2d7f73;--soft:#e8efed;--p:#365f9d;--f:#9a5c33;--s:#6d5a93}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:18px 14px 95px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}h1{margin:0;font-size:28px}.sub,.muted{color:#71807a;font-size:13px}.ver{background:#e7eeeb;border-radius:99px;padding:6px 10px;font-size:12px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.room{border:0;border-radius:18px;padding:15px 10px;color:#fff;text-align:left;min-height:90px}.room strong{display:block;font-size:17px;margin-bottom:8px}.personal{background:var(--p)}.family{background:var(--f)}.social{background:var(--s)}.room.active{outline:3px solid #fff;box-shadow:0 0 0 3px #345d55}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 26px #00000010}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h2{margin:0;font-size:20px}label{display:block;margin-top:11px;font-size:13px;font-weight:700;color:#53645f}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #cdd9d5;border-radius:13px;background:#fff;font:inherit}textarea{min-height:145px;resize:vertical;line-height:1.55}.grid{display:grid;grid-template-columns:160px 1fr;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:750;background:var(--g);color:#fff}.secondary{background:var(--soft);color:#235b52}.ghost{background:#f6f8f7;color:#47615a;border:1px solid #dce5e2}.danger{background:#984747}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0}.tab{border:0;border-radius:99px;padding:9px 13px;background:#eef3f1;color:#365b53;font-weight:700;white-space:nowrap}.tab.active{background:var(--g);color:#fff}.filters{display:grid;grid-template-columns:1fr 150px 150px;gap:8px}.date{margin-top:17px}.datehead{font-size:14px;font-weight:800;color:#5e746e;border-bottom:1px solid #e4ebe8;padding:8px 2px}.entry{padding:14px 2px;border-bottom:1px solid #edf0ee}.entryhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.entry h3{margin:0 0 4px;font-size:18px}.entry p{white-space:pre-wrap;line-height:1.58}.badge{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;color:#fff}.badge.p{background:var(--p)}.badge.f{background:var(--f)}.badge.s{background:var(--s)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:8px 10px}.empty{text-align:center;padding:30px;color:#71807a}.footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;background:#fffffff0;border-top:1px solid #dfe6e3;font-size:12px;color:#687772}@media(max-width:640px){.grid,.filters{grid-template-columns:1fr}.room strong{font-size:15px}.entryhead{display:block}.badge{margin-top:5px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><div class="sub">날짜와 주제로 정리하는 나의 기록 아카이브</div><h1>기억의 서랍</h1></div><span class="ver">V2.0</span></header>

<div class="rooms">
<button class="room personal" data-room="개인" onclick="selectRoom('개인')"><strong>👤 개인 기록실</strong><span id="cp">0개</span></button>
<button class="room family" data-room="가족" onclick="selectRoom('가족')"><strong>👪 가족 기록실</strong><span id="cf">0개</span></button>
<button class="room social" data-room="사회" onclick="selectRoom('사회')"><strong>🌏 사회 기록실</strong><span id="cs">0개</span></button>
</div>

<section class="card" id="editor">
<div class="top"><h2 id="editorTitle">새 꼭지 기록</h2><span class="muted" id="hint">개인 기록실에 저장</span></div>
<div class="grid">
<label>날짜<input id="recordDate" type="date"></label>
<label>주제<select id="category"><option>개인</option><option>가족</option><option>사회</option></select></label>
</div>
<label>꼭지 제목<input id="title" maxlength="120" placeholder="예: 첫 직장의 기억, 아버지와의 여행"></label>
<label>기록<textarea id="memo" placeholder="직접 입력하거나 ‘말로 입력’을 눌러 말씀하세요."></textarea></label>
<div class="row"><button class="btn" onclick="speech('memo')">🎙 말로 입력</button><button class="btn secondary" id="saveBtn" onclick="saveRecord()">저장</button><button class="btn ghost" onclick="resetEditor()">새 기록</button></div>
<div id="status" class="muted" style="margin-top:9px">기록은 이 휴대폰 안에 저장됩니다.</div>
</section>

<section class="card" id="archive">
<div class="top"><h2 id="roomTitle">개인 기록실</h2><span class="muted" id="count">0개</span></div>
<div class="tabs"><button class="tab" data-filter="전체" onclick="setFilter('전체')">전체</button><button class="tab active" data-filter="개인" onclick="setFilter('개인')">개인</button><button class="tab" data-filter="가족" onclick="setFilter('가족')">가족</button><button class="tab" data-filter="사회" onclick="setFilter('사회')">사회</button></div>
<div class="filters"><input id="search" placeholder="제목이나 내용 검색" oninput="render()"><input id="month" type="month" onchange="render()"><select id="order" onchange="render()"><option value="desc">최신 날짜순</option><option value="asc">오래된 날짜순</option></select></div>
<div class="row"><button class="btn secondary" onclick="speech('search')">🎙 말로 찾기</button><button class="btn ghost" onclick="clearFilters()">검색 초기화</button></div>
<div id="list"></div>
</section>

<section class="card"><h2>백업과 복원</h2><p class="muted">개인·가족·사회 기록실 전체를 한 파일로 백업합니다.</p><div class="row"><button class="btn secondary" onclick="backup()">전체 백업</button><label class="btn secondary" for="restore" style="margin:0">백업 복원</label><input id="restore" type="file" accept="application/json" hidden></div></section>
</div>
<div class="footer">기억의 서랍 V2.0 · 개인 · 가족 · 사회 기록실</div>

<script>
var KEY='memoryDrawer.v20',OLD='memoryDrawer.v13',CATS=['개인','가족','사회'];
var records=load(),filter='개인',editing=null;
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function norm(r){var c=CATS.indexOf(r.category)>=0?r.category:'개인',cr=r.createdAt||new Date().toISOString(),rd=/^\d{4}-\d{2}-\d{2}$/.test(String(r.recordDate||''))?r.recordDate:String(cr).slice(0,10);return{id:r.id||Date.now()+'-'+Math.random().toString(16).slice(2),title:String(r.title||'제목 없는 기록'),text:String(r.text||''),category:c,recordDate:rd,createdAt:cr,updatedAt:r.updatedAt||cr}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(x))return x.map(norm)}catch(e){}var old=[];try{old=JSON.parse(localStorage.getItem(OLD)||'[]')}catch(e){}if(Array.isArray(old)&&old.length){var m=old.map(function(x){return norm({id:x.id,title:'이전 기록',text:x.text,category:'개인',recordDate:String(x.createdAt||'').slice(0,10)||today(),createdAt:x.createdAt})});localStorage.setItem(KEY,JSON.stringify(m));return m}return[]}
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cls(c){return c==='가족'?'f':c==='사회'?'s':'p'}
function dtext(s){if(!s)return'';var a=s.split('-');return a[0]+'년 '+Number(a[1])+'월 '+Number(a[2])+'일'}
function status(s){document.getElementById('status').textContent=s}
function sync(){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.filter===filter)});document.querySelectorAll('.room').forEach(function(b){b.classList.toggle('active',b.dataset.room===filter)})}
function selectRoom(c){filter=c;document.getElementById('category').value=c;hint();sync();render();document.getElementById('archive').scrollIntoView({behavior:'smooth'})}
function setFilter(c){filter=c;sync();render()}
function hint(){document.getElementById('hint').textContent=document.getElementById('category').value+' 기록실에 저장'}
document.getElementById('category').addEventListener('change',hint);
function resetEditor(){editing=null;document.getElementById('editorTitle').textContent='새 꼭지 기록';document.getElementById('saveBtn').textContent='저장';document.getElementById('recordDate').value=today();document.getElementById('title').value='';document.getElementById('memo').value='';if(CATS.indexOf(filter)>=0)document.getElementById('category').value=filter;hint()}
function saveRecord(){var title=document.getElementById('title').value.trim(),text=document.getElementById('memo').value.trim(),cat=document.getElementById('category').value,rd=document.getElementById('recordDate').value||today();if(!title){status('꼭지 제목을 입력해 주세요.');return}if(!text){status('기록 내용을 입력해 주세요.');return}var now=new Date().toISOString(),was=!!editing;if(editing){var i=records.findIndex(function(r){return r.id===editing});if(i>=0)records[i]=Object.assign({},records[i],{title:title,text:text,category:cat,recordDate:rd,updatedAt:now})}else records.push({id:Date.now()+'-'+Math.random().toString(16).slice(2),title:title,text:text,category:cat,recordDate:rd,createdAt:now,updatedAt:now});persist();filter=cat;resetEditor();filter=cat;sync();render();status(was?'꼭지를 수정했습니다.':'새 꼭지를 저장했습니다.')}
function editRecord(id){var r=records.find(function(x){return x.id===id});if(!r)return;editing=id;document.getElementById('editorTitle').textContent='꼭지 수정';document.getElementById('saveBtn').textContent='수정 저장';document.getElementById('recordDate').value=r.recordDate;document.getElementById('category').value=r.category;document.getElementById('title').value=r.title;document.getElementById('memo').value=r.text;hint();status('날짜·주제·제목·내용을 수정할 수 있습니다.');document.getElementById('editor').scrollIntoView({behavior:'smooth'})}
function removeRecord(id){var r=records.find(function(x){return x.id===id});if(!r||!confirm('‘'+r.title+'’ 꼭지를 삭제할까요?'))return;records=records.filter(function(x){return x.id!==id});persist();render();status('꼭지를 삭제했습니다.')}
function moveRecord(id,c){var r=records.find(function(x){return x.id===id});if(!r)return;r.category=c;r.updatedAt=new Date().toISOString();persist();render();status('‘'+r.title+'’을 '+c+' 기록실로 옮겼습니다.')}
function rows(){var q=document.getElementById('search').value.trim().toLowerCase(),m=document.getElementById('month').value,o=document.getElementById('order').value,a=records.filter(function(r){return(filter==='전체'||r.category===filter)&&(!m||r.recordDate.indexOf(m)===0)&&(!q||r.title.toLowerCase().indexOf(q)>=0||r.text.toLowerCase().indexOf(q)>=0)});a.sort(function(x,y){var c=x.recordDate.localeCompare(y.recordDate)||x.createdAt.localeCompare(y.createdAt);return o==='asc'?c:-c});return a}
function render(){var p=records.filter(function(r){return r.category==='개인'}).length,f=records.filter(function(r){return r.category==='가족'}).length,s=records.filter(function(r){return r.category==='사회'}).length;document.getElementById('cp').textContent=p+'개';document.getElementById('cf').textContent=f+'개';document.getElementById('cs').textContent=s+'개';document.getElementById('roomTitle').textContent=filter==='전체'?'전체 기록실':filter+' 기록실';var a=rows();document.getElementById('count').textContent=a.length+'개';var groups={};a.forEach(function(r){(groups[r.recordDate]||(groups[r.recordDate]=[])).push(r)});var keys=Object.keys(groups);if(document.getElementById('order').value==='desc')keys.sort().reverse();else keys.sort();if(!a.length){document.getElementById('list').innerHTML='<div class="empty">이 조건에 맞는 기록이 없습니다.</div>';return}var html='';keys.forEach(function(date){html+='<div class="date"><div class="datehead">'+esc(dtext(date))+' · '+groups[date].length+'개</div>';groups[date].forEach(function(r){html+='<article class="entry"><div class="entryhead"><div><h3>'+esc(r.title)+'</h3><span class="muted">작성 '+esc(new Date(r.createdAt).toLocaleDateString('ko-KR'))+'</span></div><span class="badge '+cls(r.category)+'">'+esc(r.category)+'</span></div><p>'+esc(r.text)+'</p><div class="actions"><button class="btn secondary" onclick="editRecord(\''+r.id+'\')">수정</button>';CATS.forEach(function(c){if(c!==r.category)html+='<button class="btn ghost" onclick="moveRecord(\''+r.id+'\',\''+c+'\')">'+c+'로 이동</button>'});html+='<button class="btn danger" onclick="removeRecord(\''+r.id+'\')">삭제</button></div></article>'});html+='</div>'});document.getElementById('list').innerHTML=html}
function clearFilters(){document.getElementById('search').value='';document.getElementById('month').value='';document.getElementById('order').value='desc';render()}
function speech(t){if(window.MemoryDrawerNative&&MemoryDrawerNative.startSpeech){status('음성인식을 시작합니다.');MemoryDrawerNative.startSpeech(t)}else status('설치형 앱에서만 음성인식을 사용할 수 있습니다.')}
window.nativeSpeechResult=function(t,x){if(t==='search'){document.getElementById('search').value=x;render();status('음성 검색어를 입력했습니다.')}else{var e=document.getElementById('memo');e.value+=(e.value?' ':'')+x;status('음성을 기록에 추가했습니다.')}}
window.nativeSpeechError=function(m){status(m||'음성인식을 사용할 수 없습니다.')}
function backup(){var obj={app:'기억의 서랍',version:'2.0',exportedAt:new Date().toISOString(),records:records},text=JSON.stringify(obj,null,2),name='기억의서랍_V2_백업_'+today()+'.json';if(window.MemoryDrawerNative&&MemoryDrawerNative.saveBackup)MemoryDrawerNative.saveBackup(name,text)}
document.getElementById('restore').addEventListener('change',async function(e){var file=e.target.files&&e.target.files[0];if(!file)return;try{var j=JSON.parse(await file.text()),a=Array.isArray(j)?j:(Array.isArray(j.records)?j.records:j.memories);if(!Array.isArray(a))throw 0;var n=a.map(function(x){return norm(Object.assign({},x,{title:x.title||(x.text?'복원된 기록':'제목 없는 기록'),category:CATS.indexOf(x.category)>=0?x.category:'개인',recordDate:x.recordDate||String(x.createdAt||'').slice(0,10)||today()}))});if(!confirm(n.length+'개의 기록을 복원할까요?'))return;var ids=new Set(records.map(function(r){return r.id}));n.forEach(function(r){if(!ids.has(r.id)){records.push(r);ids.add(r.id)}});persist();render();status('백업을 복원했습니다.')}catch(err){status('올바른 기억의 서랍 백업 파일이 아닙니다.')}e.target.value=''})
document.getElementById('recordDate').value=today();hint();sync();render();
</script>
</body>
</html>
